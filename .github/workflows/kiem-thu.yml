name: Kiểm thử tự động

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-thu:
    # Cố định Ubuntu 24.04: từ 19/10/2026 nhãn ubuntu-latest chuyển dần sang Ubuntu 26,
    # bản Playwright đang dùng chưa cài được Chromium trên đó. Kết quả kiểm thử không phụ thuộc đợt nâng cấp của GitHub.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      # Ghim theo mã băm commit (không theo nhãn v4 có thể bị đổi): actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện kiểm thử
        run: npm ci

      - name: Cài trình duyệt Chromium
        run: npx playwright install --with-deps chromium

      - name: index.html và sw.js khớp với mã nguồn trong src/
        run: node build.mjs --check

      - name: Chạy toàn bộ kiểm thử
        run: node tests/run-all.js

      - name: Lưu nhật ký kiểm thử
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nhat-ky-kiem-thu
          path: test-output/
          retention-days: 14
